name: Build AuraLyrics IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Verify and Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive AuraLyrics App
        run: |
          xcodebuild archive \
            -project AuraLyrics.xcodeproj \
            -scheme AuraLyrics \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AuraLyrics.xcarchive \
            MARKETING_VERSION="0.1.0" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unified IPA
        run: |
          mkdir -p ipa_output
          VERSION="0.1.0"
          BUILD="${{ github.run_number }}"
          echo "Packaging AuraLyrics version: ${VERSION} (Build ${BUILD})"
          mkdir -p package/Payload
          cp -r build/AuraLyrics.xcarchive/Products/Applications/AuraLyrics.app package/Payload/

          # 雙重防護：使用 PlistBuddy 確保打包檔案內的 Info.plist 版本與 Build 號精準一致
          MAIN_PLIST="package/Payload/AuraLyrics.app/Info.plist"
          if [ -f "$MAIN_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "$MAIN_PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${VERSION}" "$MAIN_PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD}" "$MAIN_PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD}" "$MAIN_PLIST"
          fi

          WIDGET_PLIST="package/Payload/AuraLyrics.app/PlugIns/AuraLyricsWidget.appex/Info.plist"
          if [ -f "$WIDGET_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "$WIDGET_PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${VERSION}" "$WIDGET_PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD}" "$WIDGET_PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD}" "$WIDGET_PLIST"
          fi

          echo "=== [驗證] Payload/AuraLyrics.app/Info.plist 版本資訊 ==="
          echo -n "CFBundleShortVersionString: "
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$MAIN_PLIST"
          echo -n "CFBundleVersion: "
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$MAIN_PLIST"

          cd package
          zip -r "../ipa_output/AuraLyrics-${VERSION}.ipa" Payload
          cd ..

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: AuraLyrics-IPA
          path: ipa_output/*.ipa
          retention-days: 14
