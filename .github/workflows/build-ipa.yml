name: Build AuraLyrics IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive AuraLyrics App
        run: |
          xcodebuild archive \
            -project AuraLyrics.xcodeproj \
            -scheme AuraLyrics \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AuraLyrics.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unified IPA
        run: |
          mkdir -p ipa_output
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" AuraLyrics/Info.plist)
          echo "Packaging AuraLyrics version: ${VERSION}"
          mkdir -p package/Payload
          cp -r build/AuraLyrics.xcarchive/Products/Applications/AuraLyrics.app package/Payload/
          cd package
          zip -r "../ipa_output/AuraLyrics-${VERSION}.ipa" Payload
          cd ..

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: AuraLyrics-IPA
          path: ipa_output/*.ipa
          retention-days: 14
