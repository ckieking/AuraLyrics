name: Build AuraLyrics IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Backup Original Info Plists
        run: |
          cp AuraLyrics/Info.plist AuraLyrics_Info_backup.plist
          cp AuraLyricsWidget/Info.plist AuraLyricsWidget_Info_backup.plist

      - name: Verify and Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive AuraLyrics App
        run: |
          xcodebuild archive \
            -project AuraLyrics.xcodeproj \
            -scheme AuraLyrics \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AuraLyrics.xcarchive \
            MARKETING_VERSION="0.10.0" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unified IPA
        run: |
          mkdir -p ipa_output
          VERSION="0.10.0-beta"
          APP_VERSION="0.10.0"
          BUILD="${{ github.run_number }}"
          echo "Packaging AuraLyrics version: ${VERSION} (Build ${BUILD})"
          mkdir -p package/Payload
          cp -r build/AuraLyrics.xcarchive/Products/Applications/AuraLyrics.app package/Payload/

          # Merge source Info.plist keys and synchronize versions
          export TARGET_VERSION="${APP_VERSION}"
          export TARGET_BUILD="${BUILD}"
          python3 - << 'EOF'
          import os, plistlib

          version = os.environ.get("TARGET_VERSION", "0.10.0")
          build = os.environ.get("TARGET_BUILD", "1")

          # 1. Main App Info.plist completion and version synchronization
          main_plist_path = "package/Payload/AuraLyrics.app/Info.plist"
          source_main_path = "AuraLyrics_Info_backup.plist" if os.path.exists("AuraLyrics_Info_backup.plist") else "AuraLyrics/Info.plist"
          if os.path.exists(main_plist_path) and os.path.exists(source_main_path):
              with open(main_plist_path, "rb") as f:
                  target = plistlib.load(f)
              with open(source_main_path, "rb") as f:
                  source = plistlib.load(f)

              # Merge all custom keys and override critical privacy and capability descriptors
              for k, v in source.items():
                  if k not in target:
                      target[k] = v

              critical_keys = [
                  "NSAppleMusicUsageDescription",
                  "NSLocationWhenInUseUsageDescription",
                  "NSLocationAlwaysAndWhenInUseUsageDescription",
                  "UIBackgroundModes",
                  "BGTaskSchedulerPermittedIdentifiers",
                  "NSSupportsLiveActivities",
                  "NSSupportsLiveActivitiesFrequentUpdates",
                  "LSRequiresIPhoneOS",
                  "UILaunchScreen",
                  "UISupportedInterfaceOrientations"
              ]
              for ck in critical_keys:
                  if ck in source:
                      target[ck] = source[ck]

              target["CFBundleShortVersionString"] = version
              target["CFBundleVersion"] = build

              with open(main_plist_path, "wb") as f:
                  plistlib.dump(target, f)
              print(f"✓ Successfully merged main App Info.plist ({len(target)} keys)")
              assert "NSAppleMusicUsageDescription" in target, "Missing NSAppleMusicUsageDescription key!"
              assert "UIBackgroundModes" in target, "Missing UIBackgroundModes key!"
              assert "BGTaskSchedulerPermittedIdentifiers" in target, "Missing BGTaskSchedulerPermittedIdentifiers key!"
              bg_ids = target.get("BGTaskSchedulerPermittedIdentifiers", [])
              assert "com.auralyrics.app.bgtask.*" in bg_ids, "Missing wildcard bgtask ID!"
              assert "com.auralyrics.app.bgtask.lyrics" in bg_ids, "Missing specific bgtask ID!"
              assert "com.auralyrics.app.bg.lyrics" in bg_ids, "Missing specific background refresh ID!"

          # 2. Widget Extension Info.plist completion and version synchronization
          widget_plist_path = "package/Payload/AuraLyrics.app/PlugIns/AuraLyricsWidget.appex/Info.plist"
          source_widget_path = "AuraLyricsWidget_Info_backup.plist" if os.path.exists("AuraLyricsWidget_Info_backup.plist") else "AuraLyricsWidget/Info.plist"
          if os.path.exists(widget_plist_path) and os.path.exists(source_widget_path):
              with open(widget_plist_path, "rb") as f:
                  target_w = plistlib.load(f)
              with open(source_widget_path, "rb") as f:
                  source_w = plistlib.load(f)

              for k, v in source_w.items():
                  if k not in target_w:
                      target_w[k] = v

              if "NSExtension" in source_w:
                  target_w["NSExtension"] = source_w["NSExtension"]

              target_w["CFBundleShortVersionString"] = version
              target_w["CFBundleVersion"] = build

              with open(widget_plist_path, "wb") as f:
                  plistlib.dump(target_w, f)
              print(f"✓ 成功合併 Widget Extension Info.plist (共 {len(target_w)} 個鍵值)")
              assert "NSExtension" in target_w, "缺少 NSExtension 鍵值！"

          EOF

          echo "=== [驗證] Payload/AuraLyrics.app/Info.plist 隱私與版本資訊 ==="
          python3 -c '
          import plistlib
          with open("package/Payload/AuraLyrics.app/Info.plist", "rb") as f:
              p = plistlib.load(f)
              print("  CFBundleIdentifier:", p.get("CFBundleIdentifier"))
              print("  CFBundleShortVersionString:", p.get("CFBundleShortVersionString"))
              print("  CFBundleVersion:", p.get("CFBundleVersion"))
              print("  NSAppleMusicUsageDescription:", p.get("NSAppleMusicUsageDescription"))
              print("  BGTaskSchedulerPermittedIdentifiers:", p.get("BGTaskSchedulerPermittedIdentifiers"))
              print("  NSSupportsLiveActivities:", p.get("NSSupportsLiveActivities"))
          '

          echo "=== [驗證] Widget Extension Info.plist 擴展與版本資訊 ==="
          python3 -c '
          import plistlib
          with open("package/Payload/AuraLyrics.app/PlugIns/AuraLyricsWidget.appex/Info.plist", "rb") as f:
              p = plistlib.load(f)
              print("  CFBundleIdentifier:", p.get("CFBundleIdentifier"))
              print("  NSExtension:", p.get("NSExtension"))
          '

          cd package
          zip -r "../ipa_output/AuraLyrics-${VERSION}.ipa" Payload
          cd ..

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: AuraLyrics-IPA
          path: ipa_output/*.ipa
          retention-days: 14

      - name: Publish Nightly Release
        if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          export BUILD_NUM="$RUN_NUM"
          export SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          export NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export VERSION_STR="0.10.0-nightly.${BUILD_NUM}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            export BRANCH_NAME="$PR_BRANCH"
            export DESC_STR="PR #${PR_NUMBER} (Build #${BUILD_NUM}-${SHORT_SHA}): ${BRANCH_NAME}"
          else
            export BRANCH_NAME="$REF_NAME"
            export DESC_STR="Nightly (Build #${BUILD_NUM}-${SHORT_SHA})"
          fi

          IPA_SRC=$(ls ipa_output/*.ipa | head -n 1)
          cp "$IPA_SRC" "ipa_output/AuraLyrics-nightly.ipa"
          export IPA_SIZE=$(stat -c%s "ipa_output/AuraLyrics-nightly.ipa" 2>/dev/null || stat -f%z "ipa_output/AuraLyrics-nightly.ipa")

          # Create or update rolling nightly release with clean title
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --target "${COMMIT_SHA}" --title "AuraLyrics (Nightly Build)" --notes "Automated nightly build #${BUILD_NUM} (${SHORT_SHA})."
          else
            gh release create nightly \
              --target "${COMMIT_SHA}" \
              --title "AuraLyrics (Nightly Build)" \
              --notes "Automated nightly build #${BUILD_NUM} (${SHORT_SHA})." \
              --prerelease
          fi

          # Clean up any lingering legacy assets
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/nightly" --jq '.assets[] | select(.name != "AuraLyrics-nightly.ipa" and .name != "apps-nightly.json") | .name' 2>/dev/null | while read -r asset_name; do
            if [ -n "$asset_name" ]; then
              gh release delete-asset nightly "$asset_name" -y || true
            fi
          done || true

          # Update nightly manifest to maintain only the single latest nightly build
          python3 - << 'EOF'
          import json
          import os

          now = os.environ["NOW"]
          ipa_size = int(os.environ.get("IPA_SIZE") or 0)
          version_str = os.environ["VERSION_STR"]
          desc_str = os.environ["DESC_STR"]
          repo = os.environ.get("GITHUB_REPOSITORY", "ckieking/AuraLyrics")

          download_url = f"https://github.com/{repo}/releases/download/nightly/AuraLyrics-nightly.ipa"

          single_version_entry = {
              "version": version_str,
              "date": now,
              "downloadURL": download_url,
              "localizedDescription": desc_str,
              "size": ipa_size,
              "minOSVersion": "16.1"
          }

          manifest_path = "docs/apps-nightly.json"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  data = json.load(f)

              data["name"] = "AuraLyrics(nightly)"
              data["subtitle"] = "latest build"

              if "apps" in data and len(data["apps"]) > 0:
                  app = data["apps"][0]
                  app["name"] = "AuraLyrics(latest build)"
                  app["subtitle"] = "latest build"
                  app["version"] = version_str
                  app["versionDate"] = now
                  app["size"] = ipa_size
                  app["downloadURL"] = download_url
                  app["versionDescription"] = desc_str
                  app["versions"] = [single_version_entry]

              with open(manifest_path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
          EOF

          # Upload single latest nightly IPA and manifest to release
          gh release upload nightly "ipa_output/AuraLyrics-nightly.ipa" docs/apps-nightly.json --clobber
