name: Build AuraLyrics IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Backup Original Info Plists
        run: |
          cp AuraLyrics/Info.plist AuraLyrics_Info_backup.plist
          cp AuraLyricsWidget/Info.plist AuraLyricsWidget_Info_backup.plist

      - name: Verify and Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive AuraLyrics App
        run: |
          xcodebuild archive \
            -project AuraLyrics.xcodeproj \
            -scheme AuraLyrics \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AuraLyrics.xcarchive \
            MARKETING_VERSION="0.1.0" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unified IPA
        run: |
          mkdir -p ipa_output
          VERSION="0.1.0"
          BUILD="${{ github.run_number }}"
          echo "Packaging AuraLyrics version: ${VERSION} (Build ${BUILD})"
          mkdir -p package/Payload
          cp -r build/AuraLyrics.xcarchive/Products/Applications/AuraLyrics.app package/Payload/

          # 核心修復：使用 Python 精確合併原始 Info.plist 權限與宣告（解決 Xcode 剝除自訂鍵值之問題）
          export TARGET_VERSION="${VERSION}"
          export TARGET_BUILD="${BUILD}"
          python3 - << 'EOF'
          import os, plistlib

          version = os.environ.get("TARGET_VERSION", "0.1.0")
          build = os.environ.get("TARGET_BUILD", "1")

          # 1. 主 App Info.plist 補全與版本同步
          main_plist_path = "package/Payload/AuraLyrics.app/Info.plist"
          source_main_path = "AuraLyrics_Info_backup.plist" if os.path.exists("AuraLyrics_Info_backup.plist") else "AuraLyrics/Info.plist"
          if os.path.exists(main_plist_path) and os.path.exists(source_main_path):
              with open(main_plist_path, "rb") as f:
                  target = plistlib.load(f)
              with open(source_main_path, "rb") as f:
                  source = plistlib.load(f)

              # 合併所有自訂欄位，並強制覆蓋關鍵隱私與能力描述
              for k, v in source.items():
                  if k not in target:
                      target[k] = v

              critical_keys = [
                  "NSAppleMusicUsageDescription",
                  "NSLocationWhenInUseUsageDescription",
                  "NSLocationAlwaysAndWhenInUseUsageDescription",
                  "UIBackgroundModes",
                  "NSSupportsLiveActivities",
                  "NSSupportsLiveActivitiesFrequentUpdates",
                  "LSRequiresIPhoneOS",
                  "UILaunchScreen",
                  "UISupportedInterfaceOrientations"
              ]
              for ck in critical_keys:
                  if ck in source:
                      target[ck] = source[ck]

              target["CFBundleShortVersionString"] = version
              target["CFBundleVersion"] = build

              with open(main_plist_path, "wb") as f:
                  plistlib.dump(target, f)
              print(f"✓ 成功合併主 App Info.plist (共 {len(target)} 個鍵值)")
              assert "NSAppleMusicUsageDescription" in target, "缺少 NSAppleMusicUsageDescription 鍵值！"
              assert "UIBackgroundModes" in target, "缺少 UIBackgroundModes 鍵值！"

          # 2. Widget Extension Info.plist 補全與版本同步
          widget_plist_path = "package/Payload/AuraLyrics.app/PlugIns/AuraLyricsWidget.appex/Info.plist"
          source_widget_path = "AuraLyricsWidget_Info_backup.plist" if os.path.exists("AuraLyricsWidget_Info_backup.plist") else "AuraLyricsWidget/Info.plist"
          if os.path.exists(widget_plist_path) and os.path.exists(source_widget_path):
              with open(widget_plist_path, "rb") as f:
                  target_w = plistlib.load(f)
              with open(source_widget_path, "rb") as f:
                  source_w = plistlib.load(f)

              for k, v in source_w.items():
                  if k not in target_w:
                      target_w[k] = v

              if "NSExtension" in source_w:
                  target_w["NSExtension"] = source_w["NSExtension"]

              target_w["CFBundleShortVersionString"] = version
              target_w["CFBundleVersion"] = build

              with open(widget_plist_path, "wb") as f:
                  plistlib.dump(target_w, f)
              print(f"✓ 成功合併 Widget Extension Info.plist (共 {len(target_w)} 個鍵值)")
              assert "NSExtension" in target_w, "缺少 NSExtension 鍵值！"

          EOF

          echo "=== [驗證] Payload/AuraLyrics.app/Info.plist 隱私與版本資訊 ==="
          python3 -c '
          import plistlib
          with open("package/Payload/AuraLyrics.app/Info.plist", "rb") as f:
              p = plistlib.load(f)
              print("  CFBundleIdentifier:", p.get("CFBundleIdentifier"))
              print("  CFBundleShortVersionString:", p.get("CFBundleShortVersionString"))
              print("  CFBundleVersion:", p.get("CFBundleVersion"))
              print("  NSAppleMusicUsageDescription:", p.get("NSAppleMusicUsageDescription"))
              print("  NSSupportsLiveActivities:", p.get("NSSupportsLiveActivities"))
          '

          echo "=== [驗證] Widget Extension Info.plist 擴展與版本資訊 ==="
          python3 -c '
          import plistlib
          with open("package/Payload/AuraLyrics.app/PlugIns/AuraLyricsWidget.appex/Info.plist", "rb") as f:
              p = plistlib.load(f)
              print("  CFBundleIdentifier:", p.get("CFBundleIdentifier"))
              print("  NSExtension:", p.get("NSExtension"))
          '

          cd package
          zip -r "../ipa_output/AuraLyrics-${VERSION}.ipa" Payload
          cd ..

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: AuraLyrics-IPA
          path: ipa_output/*.ipa
          retention-days: 14
