name: Build AuraLyrics IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive AuraLyrics App
        run: |
          xcodebuild archive \
            -project AuraLyrics.xcodeproj \
            -scheme AuraLyrics \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AuraLyrics.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPAs (Full & LiveContainer)
        run: |
          mkdir -p ipa_output

          # 1. 打包完整版（含動態島 Widget Extension + PiP 懸浮窗，適合直接側載或 TrollStore）
          mkdir -p package_full/Payload
          cp -r build/AuraLyrics.xcarchive/Products/Applications/AuraLyrics.app package_full/Payload/
          cd package_full
          zip -r ../ipa_output/AuraLyrics-Full.ipa Payload
          cd ..

          # 2. 打包 LiveContainer 專用單體版（移除 PlugIns 目錄，免消耗額外 App ID，極度純淨相容）
          mkdir -p package_lc/Payload
          cp -r build/AuraLyrics.xcarchive/Products/Applications/AuraLyrics.app package_lc/Payload/
          rm -rf package_lc/Payload/AuraLyrics.app/PlugIns
          cd package_lc
          zip -r ../ipa_output/AuraLyrics-LiveContainer.ipa Payload
          cd ..

      - name: Upload IPAs as Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: AuraLyrics-IPAs
          path: ipa_output/*.ipa
          retention-days: 14
