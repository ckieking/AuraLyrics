name: Build AuraLyrics IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Backup Original Info Plists
        run: |
          cp AuraLyrics/Info.plist AuraLyrics_Info_backup.plist
          cp AuraLyricsWidget/Info.plist AuraLyricsWidget_Info_backup.plist

      - name: Verify and Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive AuraLyrics App
        run: |
          xcodebuild archive \
            -project AuraLyrics.xcodeproj \
            -scheme AuraLyrics \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AuraLyrics.xcarchive \
            MARKETING_VERSION="0.10.0" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unified IPA
        run: |
          mkdir -p ipa_output
          VERSION="0.10.0-beta"
          APP_VERSION="0.10.0"
          BUILD="${{ github.run_number }}"
          echo "Packaging AuraLyrics version: ${VERSION} (Build ${BUILD})"
          mkdir -p package/Payload
          cp -r build/AuraLyrics.xcarchive/Products/Applications/AuraLyrics.app package/Payload/

          # Merge source Info.plist keys and synchronize versions
          export TARGET_VERSION="${APP_VERSION}"
          export TARGET_BUILD="${BUILD}"
          python3 - << 'EOF'
          import os, plistlib

          version = os.environ.get("TARGET_VERSION", "0.10.0")
          build = os.environ.get("TARGET_BUILD", "1")

          # 1. Main App Info.plist completion and version synchronization
          main_plist_path = "package/Payload/AuraLyrics.app/Info.plist"
          source_main_path = "AuraLyrics_Info_backup.plist" if os.path.exists("AuraLyrics_Info_backup.plist") else "AuraLyrics/Info.plist"
          if os.path.exists(main_plist_path) and os.path.exists(source_main_path):
              with open(main_plist_path, "rb") as f:
                  target = plistlib.load(f)
              with open(source_main_path, "rb") as f:
                  source = plistlib.load(f)

              # Merge all custom keys and override critical privacy and capability descriptors
              for k, v in source.items():
                  if k not in target:
                      target[k] = v

              critical_keys = [
                  "NSAppleMusicUsageDescription",
                  "NSLocationWhenInUseUsageDescription",
                  "NSLocationAlwaysAndWhenInUseUsageDescription",
                  "UIBackgroundModes",
                  "NSSupportsLiveActivities",
                  "NSSupportsLiveActivitiesFrequentUpdates",
                  "LSRequiresIPhoneOS",
                  "UILaunchScreen",
                  "UISupportedInterfaceOrientations"
              ]
              for ck in critical_keys:
                  if ck in source:
                      target[ck] = source[ck]

              target["CFBundleShortVersionString"] = version
              target["CFBundleVersion"] = build

              with open(main_plist_path, "wb") as f:
                  plistlib.dump(target, f)
              print(f"✓ Successfully merged main App Info.plist ({len(target)} keys)")
              assert "NSAppleMusicUsageDescription" in target, "Missing NSAppleMusicUsageDescription key!"
              assert "UIBackgroundModes" in target, "Missing UIBackgroundModes key!"

          # 2. Widget Extension Info.plist completion and version synchronization
          widget_plist_path = "package/Payload/AuraLyrics.app/PlugIns/AuraLyricsWidget.appex/Info.plist"
          source_widget_path = "AuraLyricsWidget_Info_backup.plist" if os.path.exists("AuraLyricsWidget_Info_backup.plist") else "AuraLyricsWidget/Info.plist"
          if os.path.exists(widget_plist_path) and os.path.exists(source_widget_path):
              with open(widget_plist_path, "rb") as f:
                  target_w = plistlib.load(f)
              with open(source_widget_path, "rb") as f:
                  source_w = plistlib.load(f)

              for k, v in source_w.items():
                  if k not in target_w:
                      target_w[k] = v

              if "NSExtension" in source_w:
                  target_w["NSExtension"] = source_w["NSExtension"]

              target_w["CFBundleShortVersionString"] = version
              target_w["CFBundleVersion"] = build

              with open(widget_plist_path, "wb") as f:
                  plistlib.dump(target_w, f)
              print(f"✓ 成功合併 Widget Extension Info.plist (共 {len(target_w)} 個鍵值)")
              assert "NSExtension" in target_w, "缺少 NSExtension 鍵值！"

          EOF

          echo "=== [驗證] Payload/AuraLyrics.app/Info.plist 隱私與版本資訊 ==="
          python3 -c '
          import plistlib
          with open("package/Payload/AuraLyrics.app/Info.plist", "rb") as f:
              p = plistlib.load(f)
              print("  CFBundleIdentifier:", p.get("CFBundleIdentifier"))
              print("  CFBundleShortVersionString:", p.get("CFBundleShortVersionString"))
              print("  CFBundleVersion:", p.get("CFBundleVersion"))
              print("  NSAppleMusicUsageDescription:", p.get("NSAppleMusicUsageDescription"))
              print("  NSSupportsLiveActivities:", p.get("NSSupportsLiveActivities"))
          '

          echo "=== [驗證] Widget Extension Info.plist 擴展與版本資訊 ==="
          python3 -c '
          import plistlib
          with open("package/Payload/AuraLyrics.app/PlugIns/AuraLyricsWidget.appex/Info.plist", "rb") as f:
              p = plistlib.load(f)
              print("  CFBundleIdentifier:", p.get("CFBundleIdentifier"))
              print("  NSExtension:", p.get("NSExtension"))
          '

          cd package
          zip -r "../ipa_output/AuraLyrics-${VERSION}.ipa" Payload
          cd ..

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: AuraLyrics-IPA
          path: ipa_output/*.ipa
          retention-days: 14

      - name: Publish Rolling Latest Build Release
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          export BUILD_NUM="$RUN_NUM"
          export SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          export NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ "$EVENT_NAME" = "pull_request" ]; then
            export IS_PR="true"
            export PR_NUM="$PR_NUMBER"
            export BRANCH_NAME="$PR_BRANCH"
            export IPA_FILENAME="AuraLyrics-PR${PR_NUM}-build${BUILD_NUM}.ipa"
            export VERSION_STR="0.10.0-pr${PR_NUM}.${BUILD_NUM}"
            export DESC_STR="PR #${PR_NUM} (Build #${BUILD_NUM}-${SHORT_SHA}): ${BRANCH_NAME}"
          else
            export IS_PR="false"
            export PR_NUM=""
            export BRANCH_NAME="$REF_NAME"
            export IPA_FILENAME="AuraLyrics-build${BUILD_NUM}.ipa"
            export VERSION_STR="0.10.0-dev.${BUILD_NUM}"
            export DESC_STR="${BRANCH_NAME} (Build #${BUILD_NUM}-${SHORT_SHA})"
          fi

          IPA_SRC=$(ls ipa_output/*.ipa | head -n 1)
          cp "$IPA_SRC" "ipa_output/${IPA_FILENAME}"
          if [ "$IS_PR" != "true" ]; then
            cp "$IPA_SRC" "ipa_output/AuraLyrics-latest.ipa"
          fi
          export IPA_SIZE=$(stat -c%s "ipa_output/${IPA_FILENAME}" 2>/dev/null || stat -f%z "ipa_output/${IPA_FILENAME}")

          # Create or update rolling latest-build release
          if gh release view latest-build > /dev/null 2>&1; then
            if [ "$IS_PR" != "true" ]; then
              gh release edit latest-build --title "AuraLyrics (Rolling Build #${BUILD_NUM}-${SHORT_SHA})" --notes "Automated rolling build. Commit: ${COMMIT_SHA}"
            fi
          else
            gh release create latest-build \
              --target "${COMMIT_SHA}" \
              --title "AuraLyrics (Rolling Build #${BUILD_NUM}-${SHORT_SHA})" \
              --notes "Automated rolling build. Commit: ${COMMIT_SHA}" \
              --prerelease
          fi

          # Attempt to download existing apps-dev.json (or fallback apps-nightly.json) to preserve build history
          gh release download latest-build -p "apps-dev.json" -O downloaded-apps-dev.json 2>/dev/null || \
          gh release download latest-build -p "apps-nightly.json" -O downloaded-apps-dev.json 2>/dev/null || true

          # Update dev manifests with multi-version build history
          python3 - << 'EOF'
          import json
          import os

          build_num = os.environ["BUILD_NUM"]
          short_sha = os.environ["SHORT_SHA"]
          now = os.environ["NOW"]
          ipa_size = int(os.environ.get("IPA_SIZE") or 0)
          ipa_filename = os.environ["IPA_FILENAME"]
          version_str = os.environ["VERSION_STR"]
          desc_str = os.environ["DESC_STR"]
          is_pr = os.environ.get("IS_PR") == "true"
          repo = os.environ.get("GITHUB_REPOSITORY", "ckieking/AuraLyrics")

          old_app = {}
          history_versions = []
          if os.path.exists("downloaded-apps-dev.json"):
              try:
                  with open("downloaded-apps-dev.json", "r", encoding="utf-8") as f:
                      old_data = json.load(f)
                      if "apps" in old_data and len(old_data["apps"]) > 0:
                          old_app = old_data["apps"][0]
                          history_versions = old_app.get("versions", [])
              except Exception as e:
                  print("Could not read previous version history:", e)

          download_url = f"https://github.com/{repo}/releases/download/latest-build/{ipa_filename}"

          new_entry = {
              "version": version_str,
              "date": now,
              "downloadURL": download_url,
              "localizedDescription": desc_str,
              "size": ipa_size,
              "minOSVersion": "16.1"
          }

          filtered_history = [v for v in history_versions if v.get("version") != version_str]
          updated_versions = [new_entry] + filtered_history
          updated_versions = updated_versions[:10]

          for manifest_path in ["docs/apps-dev.json", "docs/apps-nightly.json"]:
              if not os.path.exists(manifest_path):
                  continue
              with open(manifest_path, "r", encoding="utf-8") as f:
                  data = json.load(f)

              data["name"] = "AuraLyrics(dev)"
              data["subtitle"] = "latest build"

              if "apps" in data and len(data["apps"]) > 0:
                  app = data["apps"][0]
                  app["name"] = "AuraLyrics(latest build)"
                  app["subtitle"] = "latest build"
                  # Only update top-level latest release metadata if building from main/workflow_dispatch, to prevent PRs from overriding default updates
                  if not is_pr:
                      app["version"] = version_str
                      app["versionDate"] = now
                      app["size"] = ipa_size
                      app["downloadURL"] = download_url
                      app["versionDescription"] = desc_str
                  elif old_app:
                      # If building a PR, retain previous main release metadata at the root level to avoid SemVer inversion
                      for key in ["version", "versionDate", "size", "downloadURL", "versionDescription"]:
                          if key in old_app:
                              app[key] = old_app[key]
                  app["versions"] = updated_versions

              with open(manifest_path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
          EOF

          # Upload new IPA and updated manifests to release
          if [ "$IS_PR" = "true" ]; then
            gh release upload latest-build "ipa_output/${IPA_FILENAME}" docs/apps-dev.json docs/apps-nightly.json --clobber
          else
            gh release upload latest-build "ipa_output/${IPA_FILENAME}" "ipa_output/AuraLyrics-latest.ipa" docs/apps-dev.json docs/apps-nightly.json --clobber
          fi
