name: AuraLyrics
options:
  bundleIdPrefix: com.auralyrics
  deploymentTarget:
    iOS: "16.2"

settings:
  SWIFT_VERSION: "5.9"
  ENABLE_BITCODE: NO
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_ALLOWED: NO
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  AuraLyrics:
    type: application
    platform: iOS
    sources:
      - path: AuraLyrics
      - path: Shared
    info:
      path: AuraLyrics/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.auralyrics.app
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_FILE: AuraLyrics/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: AuraLyricsWidget

  AuraLyricsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AuraLyricsWidget
      - path: Shared
    info:
      path: AuraLyricsWidget/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.auralyrics.app.widget
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_FILE: AuraLyricsWidget/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
